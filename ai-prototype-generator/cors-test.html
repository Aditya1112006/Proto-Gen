<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CORS Test - Frontend</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #1a1a2e;
            color: #eee;
        }
        h1 { color: #00d4ff; }
        button {
            background: #00d4ff;
            color: #1a1a2e;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px 5px;
        }
        button:hover { background: #00a8cc; }
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            font-family: monospace;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .success { background: #1e3a1e; border: 1px solid #4ade80; }
        .error { background: #3a1e1e; border: 1px solid #f87171; }
        .info { background: #1e2a3a; border: 1px solid #60a5fa; }
        .origin { color: #fbbf24; font-weight: bold; }
    </style>
</head>
<body>
    <h1>🧪 CORS Test Page</h1>
    <p>Current Origin: <span class="origin" id="currentOrigin"></span></p>
    <p>Testing API: <code>http://localhost:5001/api/prototype/generate</code></p>

    <button onclick="testGenerate()">Test POST /api/prototype/generate</button>
    <button onclick="testHealth()">Test GET /api/health</button>
    <button onclick="clearResults()">Clear Results</button>

    <div id="results"></div>

    <script>
        document.getElementById('currentOrigin').textContent = window.location.origin;

        function log(message, type = 'info') {
            const results = document.getElementById('results');
            const div = document.createElement('div');
            div.className = `result ${type}`;
            div.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            results.insertBefore(div, results.firstChild);
        }

        function clearResults() {
            document.getElementById('results').innerHTML = '';
        }

        async function testGenerate() {
            log('Testing POST /api/prototype/generate...', 'info');
            try {
                const response = await fetch('http://localhost:5001/api/prototype/generate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        prompt: 'Create a simple todo app with React'
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    log(`✅ SUCCESS! Status: ${response.status}\nResponse: ${JSON.stringify(data, null, 2)}`, 'success');
                } else {
                    log(`❌ FAILED! Status: ${response.status}\nResponse: ${JSON.stringify(data, null, 2)}`, 'error');
                }
            } catch (error) {
                log(`❌ CORS ERROR: ${error.message}\n\nThis means the browser blocked the request due to CORS policy.`, 'error');
            }
        }

        async function testHealth() {
            log('Testing GET /api/health...', 'info');
            try {
                const response = await fetch('http://localhost:5001/api/health');
                const data = await response.json();

                if (response.ok) {
                    log(`✅ SUCCESS! Status: ${response.status}\nResponse: ${JSON.stringify(data, null, 2)}`, 'success');
                } else {
                    log(`❌ FAILED! Status: ${response.status}`, 'error');
                }
            } catch (error) {
                log(`❌ CORS ERROR: ${error.message}`, 'error');
            }
        }

        // Auto-test on load
        window.onload = () => {
            log('Page loaded. Click buttons to test CORS.', 'info');
        };
    </script>
</body>
</html>
